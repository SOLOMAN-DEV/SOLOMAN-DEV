[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabar-mart-crm"
version = "1.1.0"
description = "CRM engine for the Sabar Mart multi-vendor marketplace"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[tool.setuptools]
packages = ["sabar_mart_crm"]
